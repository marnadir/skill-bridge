# Prompt of the redact-pii lambda. Fixed format: a single
# 'prompt: |' block scalar (the lambda runtime has no PyYAML,
# the block is read directly - keep this structure).
prompt: |
  The following text is a CV transcription being pseudonymized. Structured identifiers (emails, phones, fiscal codes) have already been replaced with [TOKEN] placeholders. Find the REMAINING personally identifying information: person names of the candidate (including in headings), postal addresses, and birth dates. Report each one with the record_pii_entities tool, using the exact span as it appears in the text. Do NOT report: company names, school/university names, city names inside job locations, skills, or [TOKEN] placeholders. If nothing remains, record an empty list.
