name: Frontend

##pipeline fe: lint+build sulle PR, deploy su S3+CloudFront al merge
##su main. Stessa identita' OIDC della pipeline terraform; bucket,
##distribution id e url della lambda arrivano dagli output terraform
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-skill-bridge-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: arn:aws:iam::820329008292:role/github-actions-ci-skill-bridge
  TF_DIR: infra/terraform/envs/dev

jobs:
  ##sulle PR: lint + build, nessun deploy
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  ##al merge su main: build con l'url reale della lambda e deploy
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      ##gli output terraform sono la fonte di verita' su bucket,
      ##distribution, api e cognito. Assegnazione PRIMA dell'echo: se
      ##un output non esiste ancora (race col job apply al primo
      ##deploy di una risorsa nuova) il job DEVE fallire, non produrre
      ##un build con variabili vuote — imparato con l'auth (ADR-014)
      - name: Terraform outputs
        id: tf
        run: |
          terraform -chdir=$TF_DIR init -input=false
          FE_BUCKET=$(terraform -chdir=$TF_DIR output -raw fe_bucket)
          FE_DISTRIBUTION_ID=$(terraform -chdir=$TF_DIR output -raw fe_distribution_id)
          API_BASE_URL=$(terraform -chdir=$TF_DIR output -raw api_base_url)
          COGNITO_DOMAIN=$(terraform -chdir=$TF_DIR output -raw cognito_domain)
          COGNITO_CLIENT_ID=$(terraform -chdir=$TF_DIR output -raw cognito_client_id)
          {
            echo "fe_bucket=$FE_BUCKET"
            echo "fe_distribution_id=$FE_DISTRIBUTION_ID"
            echo "api_base_url=$API_BASE_URL"
            echo "cognito_domain=$COGNITO_DOMAIN"
            echo "cognito_client_id=$COGNITO_CLIENT_ID"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.tf.outputs.api_base_url }}
          VITE_COGNITO_DOMAIN: ${{ steps.tf.outputs.cognito_domain }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.tf.outputs.cognito_client_id }}

      - name: Deploy su S3
        run: aws s3 sync frontend/dist "s3://${{ steps.tf.outputs.fe_bucket }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.fe_distribution_id }}" \
            --paths "/*"
