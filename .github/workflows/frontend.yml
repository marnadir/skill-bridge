name: Frontend

##pipeline fe: lint+build sulle PR, deploy su S3+CloudFront al merge
##su main. Stessa identita' OIDC della pipeline terraform; bucket,
##distribution id e url della lambda arrivano dagli output terraform
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-skill-bridge-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: arn:aws:iam::820329008292:role/github-actions-ci-skill-bridge
  TF_DIR: infra/terraform/envs/dev

jobs:
  ##sulle PR: lint + build, nessun deploy
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  ##al merge su main: build con l'url reale della lambda e deploy
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      ##gli output terraform sono la fonte di verita' su bucket,
      ##distribution e function url della lambda presign
      - name: Terraform outputs
        id: tf
        run: |
          terraform -chdir=$TF_DIR init -input=false
          echo "fe_bucket=$(terraform -chdir=$TF_DIR output -raw fe_bucket)" >> "$GITHUB_OUTPUT"
          echo "fe_distribution_id=$(terraform -chdir=$TF_DIR output -raw fe_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "presign_cv_url=$(terraform -chdir=$TF_DIR output -raw presign_cv_url)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.tf.outputs.presign_cv_url }}

      - name: Deploy su S3
        run: aws s3 sync frontend/dist "s3://${{ steps.tf.outputs.fe_bucket }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.fe_distribution_id }}" \
            --paths "/*"
