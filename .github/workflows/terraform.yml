name: Terraform

##pipeline infra: plan sulle PR, apply al merge su main.
##L'identita' AWS arriva via OIDC dal ruolo github-actions-ci-skill-bridge
##(gestito dal repo aws-account-bootstrap): nessuna chiave statica
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      ##lambda sources are zipped by terraform (archive_file):
      ##backend changes must re-run plan/apply too
      - "backend/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "backend/**"
      - ".github/workflows/terraform.yml"

##id-token serve per l'autenticazione OIDC verso AWS
permissions:
  id-token: write
  contents: read

##un solo run infra alla volta, per non avere plan/apply concorrenti sullo state
concurrency:
  group: terraform-skill-bridge-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: arn:aws:iam::820329008292:role/github-actions-ci-skill-bridge
  TF_ROOT: infra/terraform
  TF_DIR: infra/terraform/envs/dev

jobs:
  ##sulle PR: controlli statici + plan, nessuna modifica alle risorse
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      ##chi sono su AWS: rende visibile nel log che la catena OIDC funziona
      - name: Whoami
        run: aws sts get-caller-identity

      - name: Terraform fmt check
        run: terraform -chdir=$TF_ROOT fmt -check -recursive

      ##il layer con le dipendenze python va costruito prima del plan:
      ##archive_file lo zippa dalla directory prodotta dallo script
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build lambda layer
        run: ./scripts/build_lambda_layer.sh

      - name: Terraform init
        run: terraform -chdir=$TF_DIR init -input=false

      - name: Terraform validate
        run: terraform -chdir=$TF_DIR validate

      - name: Terraform plan
        run: terraform -chdir=$TF_DIR plan -input=false -no-color

  ##al merge su main: applica le modifiche all'ambiente dev
  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build lambda layer
        run: ./scripts/build_lambda_layer.sh

      - name: Terraform init
        run: terraform -chdir=$TF_DIR init -input=false

      - name: Terraform apply
        run: terraform -chdir=$TF_DIR apply -input=false -auto-approve
